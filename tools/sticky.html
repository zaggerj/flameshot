<!doctype html>
<html><head><meta charset="utf-8"><title>SCROLL-TEST-STICKY</title>
<style>
  html,body{margin:0;padding:0;background:#fff;font:22px Arial;}
  /* Fixed bottom bar: the case that silently truncates naive stitchers,
     because its rows never change and therefore match at every offset. */
  #bottombar{position:fixed;left:0;right:0;bottom:0;height:88px;background:#e67e22;
             color:#fff;display:flex;align-items:center;padding-left:24px;
             box-sizing:border-box;z-index:20;border-top:3px solid #7f3f00;}
  /* Fixed top bar. */
  #topbar{position:fixed;left:0;right:0;top:0;height:56px;background:#0a3d62;
          color:#fff;display:flex;align-items:center;padding-left:24px;
          box-sizing:border-box;z-index:20;}
  /* Fixed left sidebar: static columns that must be dropped from the match. */
  #side{position:fixed;left:0;top:56px;bottom:88px;width:110px;background:#1e272e;
        z-index:10;color:#8ed6ff;font-size:15px;padding:8px;box-sizing:border-box;}
  #content{padding-top:56px;padding-bottom:88px;padding-left:110px;}
  .row{height:90px;color:#fff;display:flex;align-items:center;
       justify-content:space-between;padding:0 40px;border-bottom:2px solid #000;
       box-sizing:border-box;}
</style></head><body>
<div id="topbar">STICKY HEADER — must appear exactly once, at the top</div>
<div id="side">fixed<br>sidebar<br>(static columns)</div>
<div id="bottombar">STICKY FOOTER — must appear exactly once, at the very bottom</div>
<div id="content"></div>
<script>
// Same deterministic palette as the plain long page, so the row checker can
// map any image row back to its source row index.
const content = document.getElementById('content');
const frag = document.createDocumentFragment();
for (let i = 1; i <= 200; i++) {
  const r = 40 + (i * 7) % 200;
  const g = 60 + (i * 3) % 180;
  const b = 90 + (i * 11) % 150;
  const d = document.createElement('div');
  d.className = 'row';
  d.style.background = `rgb(${r},${g},${b})`;
  d.innerHTML = `<span>ROW ${String(i).padStart(3, '0')}</span>` +
                `<b>scroll test payload ${i * i}</b>`;
  frag.appendChild(d);
}
content.appendChild(frag);
</script>
</body></html>
